name: Vendor brand assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set +e
          mkdir -p "$(dirname 'img/jay-cannone.jpg')"
          echo 'Fetching img/jay-cannone.jpg'
          curl -fsSL --max-time 30 --max-filesize 10485760 -A 'Mozilla/5.0 (compatible; site-builder)' -o 'img/jay-cannone.jpg' 'https://www.raveis.com/photos/Agent/Agent596821.jpg' || echo '  MISS img/jay-cannone.jpg'
      - name: Drop anything that is not a real image
        run: |
          for f in $(git status --porcelain --untracked-files=all | awk '{print $2}'); do
            case "$f" in .github/*) continue;; esac
            if [ -f "$f" ]; then
              t=$(file -b --mime-type "$f")
              case "$t" in
                image/*|font/*|application/font*) : ;;
                text/xml|application/xml|text/plain)
                  # SVG is reported inconsistently across `file` versions.
                  if head -c 1024 "$f" | grep -qi '<svg'; then :; else
                    echo "  DROP $f ($t, not an svg)"; rm -f "$f"; fi ;;
                *) echo "  DROP $f ($t)"; rm -f "$f" ;;
              esac
            fi
          done
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet && echo 'nothing vendored' && exit 0
          git commit -m 'Vendor brand assets'
          git push
